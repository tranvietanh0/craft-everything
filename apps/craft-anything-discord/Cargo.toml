[package]
name = "craft-anything-discord"
description = "Discord bot that ports an Android app: /port, the progress board and the rebuild run"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The engine's project folder and the builder notes (a tester's failure is left for the builder).
craft-anything-ai = { workspace = true }
craft-anything-engine = { workspace = true }
craft-anything-evidence = { workspace = true }
craft-anything-platform = { workspace = true }
# The daily summary's local time, and job and activity times in bot.json (already in the tree
# through serenity).
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Discord gateway and REST: slash commands, buttons, channels, embeds and threads. No standard
# (prefix) framework. TLS through the system's (native-tls; OpenSSL on Linux): serenity 0.12's
# rustls backend pins tokio-tungstenite 0.21 and with it rustls 0.22 and rustls-webpki 0.102,
# which have open RustSec advisories that no 0.12 release can take a fix for.
serenity = { version = "0.12", default-features = false, features = ["builder", "cache", "chrono", "client", "collector", "gateway", "http", "model", "native_tls_backend", "utils"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
# Downloads (attachments and links), the same blocking client crates/ai and crates/engines use.
ureq = "3"

[dev-dependencies]
tempfile = "3"
